<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- 深色圆角底, 与暗色模式背景和谐 -->
    <rect width="64" height="64" rx="6" fill="#1a1a1a"/>

    <!-- 相框 (圆角矩形描边) -->
    <rect x="14" y="18" width="36" height="28" rx="2" fill="none" stroke="#4a4a4a" stroke-width="2"/>

    <!-- 左上角太阳 (圆点) -->
    <circle cx="22" cy="26" r="3" fill="#4a4a4a"/>

    <!-- 山峰轮廓 (折线) -->
    <path d="M 14 46 L 24 34 L 32 40 L 40 32 L 50 46"
          fill="none" stroke="#4a4a4a" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round"/>
</svg>
